baseURL = 'https://blog.ishdeshpa.com/'
locale = 'en-US'
title = 'blog.ishdeshpa.com'
author = 'Ishan Deshpande'

# Generate "Bearblog"-like URLs only, see https://bearblog.dev/
disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]
[permalinks]
  blog = "/:slug/"
  tags = "/blog/:slug"

[params]
  description = "Ishan Deshpande's blog"
  title = "blog.ishdeshpa.com"

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = 'github.com/janraasch/hugo-bearblog'

[[menu.main]]
  identifier = "home"
  name = "back home"
  url = "https://ishdeshpa.com"
  weight = 1
